<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ترجمة اتفاقية الحدود</title>
<style>
body{margin:0;background:#555;font-family:sans-serif}
#bar{position:sticky;top:0;background:#222;padding:10px;text-align:center;z-index:5}
#bar a{color:#fff;background:#1a56db;padding:8px 18px;border-radius:8px;text-decoration:none}
.pg{display:block;margin:10px auto;background:#fff}
#msg{color:#fff;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="bar"><a id="dl" download>تحميل الكتاب</a> <a id="op" target="_blank" style="background:#444">فتح بشكله الأصلي</a></div>
<div id="msg">جاري التحميل...</div>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var url = encodeURI("ترجمة اتفاقية الحدود مع غلاف للقراءة.pdf");
document.getElementById("dl").href = url;
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var dpr = Math.min(Math.max(window.devicePixelRatio || 2, 2), 3);
var cssW = Math.min(document.documentElement.clientWidth || window.innerWidth, 900);
var pdfDoc = null;

function renderPage(c) {
  if (c.dataset.r === "1") return;
  c.dataset.r = "1";
  pdfDoc.getPage(+c.dataset.n).then(function (p) {
    var w0 = p.getViewport({ scale: 1 }).width;
    var vp = p.getViewport({ scale: (cssW / w0) * dpr });
    c.width = vp.width;
    c.height = vp.height;
    return p.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  });
}

function clearPage(c) {
  if (c.dataset.r !== "1") return;
  c.dataset.r = "0";
  c.width = 0;
  c.height = 0;
}

document.getElementById("op").href = url;
pdfjsLib.getDocument({ url: url, disableFontFace: true }).promise.then(async function (pdf) {
  pdfDoc = pdf;
  document.getElementById("msg").remove();
  var holder = document.getElementById("pages");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) renderPage(e.target); else clearPage(e.target);
    });
  }, { rootMargin: "1500px 0px" });
  for (var i = 1; i <= pdf.numPages; i++) {
    var p = await pdf.getPage(i);
    var vp = p.getViewport({ scale: 1 });
    var c = document.createElement("canvas");
    c.className = "pg";
    c.dataset.n = i;
    c.dataset.r = "0";
    c.style.width = cssW + "px";
    c.style.height = (cssW * vp.height / vp.width) + "px";
    holder.appendChild(c);
    io.observe(c);
  }
}).catch(function () {
  document.getElementById("msg").innerHTML = '<a href="' + url + '" style="color:#fff">اضغط هنا لفتح الكتاب</a>';
});
</script>
</body>
</html>
